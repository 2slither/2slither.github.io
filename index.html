<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/png" href="Slither-icon.png">
    <title>Slither.io Clone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            background-color: #0a0a15;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
            user-select: none;
        }
        #score {
            font-size: 24px;
            font-weight: bold;
        }
        #mass {
            font-size: 16px;
            opacity: 0.8;
        }
                #leaderboard {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px;
            text-shadow: 1px 1px 3px black, 0 0 6px black;
            user-select: none;
            z-index: 2;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 400;
            text-align: right;
            letter-spacing: 0.3px;
        }
        .leaderboard-title {
            font-weight: 900;
            font-size: 20px;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: 1.5px;
        }
        #leaderboard-content div {
            line-height: 1.4;
        }

        #start-screen, #death-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }

        #start-screen {
            background: radial-gradient(ellipse at center,
                #2e5a3e 0%,
                #1a3524 55%,
                #0a1410 100%);
        }

        #death-screen {
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
        }

        #start-screen h1.title {
            font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
            font-weight: 900;
            font-size: 96px;
            letter-spacing: 2px;
            margin: 0 0 40px 0;
            color: #6a5a8a;
            user-select: none;
            margin-bottom: 500px;
        }

        #name-input {
            width: 380px;
            max-width: 80%;
            padding: 16px 22px;
            font-size: 18px;
            font-family: 'Arial', sans-serif;
            border: none;
            border-radius: 25px;
            background-color: #4c447c;
            color: #ffffff;
            outline: none;
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            bottom: 450px;
        }

        #name-input::placeholder {
            color: #6e6eae;
            font-weight: 500;
        }

        #start-button {
            position: relative;
            width: 110px;
            background-color: #2e5a3e;
            color: #ffffff;
            border: none;
            appearance: none;
            -webkit-appearance: none;
            font-weight: bold;
            text-align: center;
            font-family: Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif;
            font-size: 20px;
            cursor: pointer;
            height: 47px;
            line-height: 47px;
            box-shadow: rgba(0, 0, 0, 0.75) 0px 3px 20px;
            border-radius: 34px;
            display: inline-block;
            position: relative;
            bottom: 350px;
            padding: 0;
            outline: 1px solid #000;
        }

                /* Change Skin button on the start screen */
        #change-skin-btn {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 110;
            user-select: none;
        }

        #change-skin-btn img {
            width: auto;
            height: 64px;
            max-width: 100px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
            transition: transform 0.15s ease;
        }

        #change-skin-btn:hover img {
            transform: scale(1.08);
        }

        #change-skin-btn span {
            margin-top: 8px;
            color: #e8e8f0;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
        }

        /* Skin customization overlay */
                #skin-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 105;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #skin-stage {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #skin-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .skin-arrow {
            position: relative;
            z-index: 2;
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(to bottom, #7ec86a, #4a9c3d);
            color: #ffffff;
            font-size: 32px;
            font-weight: 900;
            cursor: pointer;
            box-shadow:
                0 6px 0 #2f6626,
                0 10px 22px rgba(0, 0, 0, 0.6);
            transition: transform 0.08s ease;
            font-family: 'Arial Black', sans-serif;
            line-height: 1;
            padding-bottom: 4px;
        }

        .skin-arrow:hover {
            background: linear-gradient(to bottom, #8ed47a, #57ac48);
        }

        .skin-arrow:active {
            transform: translateY(4px);
            box-shadow:
                0 2px 0 #2f6626,
                0 4px 10px rgba(0, 0, 0, 0.6);
        }

        #skin-prev { margin-left: 16px; }
        #skin-next { margin-right: 16px; }

        #skin-save {
            margin-top: 32px;
            padding: 16px 70px;
            font-size: 20px;
            font-family: 'Arial Black', sans-serif;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            background-color: #151a28;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            outline: none;
            box-shadow:
                0 6px 0 #080c14,
                0 12px 28px rgba(0, 0, 0, 0.7);
            transition: transform 0.08s ease;
        }

        #skin-save:hover { background-color: #1e2438; }
        #skin-save:active {
            transform: translateY(4px);
            box-shadow:
                0 2px 0 #080c14,
                0 6px 14px rgba(0, 0, 0, 0.7);
        }

        #skin-prev {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            margin: 0;
        }

        #skin-next {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            margin: 0;
        }

        #skin-save {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
        }

        #fade-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            opacity: 0;
            display: none;
            pointer-events: none;
            z-index: 200;
        }

        #change-cosmetic-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 120;
            user-select: none;
        }

        #change-cosmetic-btn img {
            width: 64px;
            height: 64px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
            transition: transform 0.15s ease;
        }

        #change-cosmetic-btn:hover img {
            transform: scale(1.08);
        }

        #change-cosmetic-btn span {
            margin-top: 8px;
            color: #e8e8f0;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
        }

        #cosmetic-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            z-index: 106;
        }

        #cosmetic-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
            cursor: pointer;
        }

        #cosmetic-save {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 70px;
            font-size: 20px;
            font-family: 'Arial Black', sans-serif;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            background-color: #151a28;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            outline: none;
            box-shadow:
                0 6px 0 #080c14,
                0 12px 28px rgba(0, 0, 0, 0.7);
            transition: transform 0.08s ease;
            z-index: 2;
        }

        #cosmetic-save:hover { background-color: #1e2438; }
        #cosmetic-save:active {
            transform: translateX(-50%) translateY(4px);
            box-shadow:
                0 2px 0 #080c14,
                0 6px 14px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="score">0</div>
        <div id="mass">0 mass</div>
    </div>
    <div id="leaderboard">
        <div class="leaderboard-title">Leaderboard</div>
        <div id="leaderboard-content"></div>
    </div>
    <canvas id="gameCanvas"></canvas>
        <div id="fade-overlay"></div>

        <div id="start-screen">
        <h1 class="title">\|/ 2Slither</h1>
        <input
            id="name-input"
            type="text"
            maxlength="48"
            placeholder="Slither name"
            autocomplete="off"
            spellcheck="false"
        />
        <button id="start-button">PLAY</button>
    </div>

     <div id="change-skin-btn">
        <img src="Slither-Settings.png" alt="Settings" />
        <span>Change Skin</span>
    </div>

    <div id="skin-screen">
            <div id="skin-stage">
                <canvas id="skin-canvas"></canvas>
                <button id="skin-prev" class="skin-arrow">◀</button>
                <button id="skin-next" class="skin-arrow">▶</button>
            </div>
            <button id="skin-save">SAVE</button>

            <div id="change-cosmetic-btn">
                <img src="Slither-Settings.png" alt="Cosmetics" />
                <span>Cosmetics</span>
            </div>
        </div>

        <div id="cosmetic-screen">
            <canvas id="cosmetic-canvas"></canvas>
            <button id="cosmetic-save">SAVE</button>
        </div>
    </div>

    <div id="death-screen">
        <h1>YOU DIED!</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="respawn-button">RESPAWN</button>
    </div>

    <script>
        // ========== HEX TILE ==========
        let lagnumber = 0.03;
        let bandScroll = 0;
        let bandlength = 2;
        let hexTileCanvas = null;

        function makeHexTile(hexSpacing, hexSize, blur, hexColor, outlineColor) {
            const HEX_W = hexSpacing * 1.5;
            const HEX_H = hexSpacing * Math.sqrt(3);
            const TW = Math.round(HEX_W * 2);
            const TH = Math.round(HEX_H * 2);

            const c = document.createElement('canvas');
            c.width = TW;
            c.height = TH;
            const cx = c.getContext('2d');

            const drawHexAt = (hx, hy) => {
                cx.beginPath();
                for (let v = 0; v < 6; v++) {
                    const a = v * Math.PI / 3;
                    const px = hx + hexSize * Math.cos(a);
                    const py = hy + hexSize * Math.sin(a);
                    if (v === 0) cx.moveTo(px, py);
                    else cx.lineTo(px, py);
                }
                cx.closePath();
            };

            // 9 wrap copies for seamless blur across tile edges
            for (let di = -1; di <= 1; di++) {
                for (let dj = -1; dj <= 1; dj++) {
                    const offX = di * TW;
                    const offY = dj * TH;

                    // PASS 1 — shadow + fill
                    cx.shadowColor = 'rgba(0, 0, 0, 0.95)';
                    cx.shadowBlur = blur;
                    cx.shadowOffsetX = 0;
                    cx.shadowOffsetY = 0;
                    cx.fillStyle = hexColor;

                    for (let col = 0; col <= 2; col++) {
                        const offset = (col & 1) ? HEX_H / 2 : 0;
                        for (let row = 0; row <= 2; row++) {
                            drawHexAt(offX + col * HEX_W, offY + row * HEX_H + offset);
                            cx.fill();
                        }
                    }

                    // PASS 2 — outline
                    cx.shadowColor = 'transparent';
                    cx.shadowBlur = 0;
                    cx.strokeStyle = outlineColor;
                    cx.lineWidth = 2;

                    for (let col = 0; col <= 2; col++) {
                        const offset = (col & 1) ? HEX_H / 2 : 0;
                        for (let row = 0; row <= 2; row++) {
                            drawHexAt(offX + col * HEX_W, offY + row * HEX_H + offset);
                            cx.stroke();
                        }
                    }
                }
            }

            return c;
        }

                // ========== COSMETICS ==========
        const COSMETICS = [
            'none', 'crown', 'tophat', 'bunny', 'cat', 'sunglasses',
            '3dglasses', 'heartglasses', 'blonde', 'afro', 'headphones',
            'goggles', 'horns', 'angelwings', 'bowtie', 'mustache'
        ];

        function drawCosmetic(ctx, id, x, y, size, angle, noOffset) {
            if (!id || id === 'none') return;

            // Each cosmetic has its own vertical offset so it sits ON the head,
            // not wrapped around it. Negative = up in head-local space.
                        // (Y_OFFSETS is now a global — see top of script)

            let ox = 0, oy = 0;
            if (!noOffset) {
                const yOff = (Y_OFFSETS[id] || 0) * size;
                const backDir = angle + Math.PI;
                ox = Math.cos(backDir) * yOff * size;
                oy = Math.sin(backDir) * yOff * size;
            }

            ctx.save();
            ctx.translate(x + ox, y + oy);
            ctx.rotate(angle);

            const eyeOffset = size * 0.55;
            const eyeAngle = Math.PI / 3;
            const lx = Math.cos(eyeAngle) * eyeOffset;
            const ly = Math.sin(eyeAngle) * eyeOffset;
            const rx = Math.cos(-eyeAngle) * eyeOffset;
            const ry = Math.sin(-eyeAngle) * eyeOffset;

            switch (id) {
                                case 'crown': {
                    // Half-ring band on top of the head
                    ctx.strokeStyle = '#e0a800';
                    ctx.lineWidth = size * 0.2;
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 0.65, Math.PI * 1.15, Math.PI * 1.85);
                    ctx.stroke();

                    // Zig-zag spikes on top of the band
                    ctx.fillStyle = '#e0a800';
                    for (let i = 0; i < 5; i++) {
                        const t = i / 4;
                        const a = Math.PI * 1.15 + t * Math.PI * 0.7;
                        const px = Math.cos(a) * size * 0.65;
                        const py = Math.sin(a) * size * 0.65;
                        ctx.beginPath();
                        ctx.moveTo(px - size * 0.09, py);
                        ctx.lineTo(px + size * 0.09, py);
                        ctx.lineTo(px, py - size * 0.3);
                        ctx.closePath();
                        ctx.fill();
                    }
                    break;
                }
                case 'tophat': {
                    ctx.fillStyle = '#111111';
                    ctx.beginPath();
                    ctx.ellipse(0, -size * 0.7, size * 0.85, size * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(-size * 0.55, -size * 1.7, size * 1.1, size);
                    ctx.beginPath();
                    ctx.ellipse(0, -size * 1.7, size * 0.55, size * 0.15, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#cc2244';
                    ctx.fillRect(-size * 0.55, -size * 1.15, size * 1.1, size * 0.18);
                    break;
                }
                case 'bunny': {
                    ctx.fillStyle = '#ff9ec8';
                    ctx.beginPath();
                    ctx.ellipse(-size * 0.3, -size * 1.1, size * 0.18, size * 0.55, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(size * 0.3, -size * 1.1, size * 0.18, size * 0.55, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffc8e0';
                    ctx.beginPath();
                    ctx.ellipse(-size * 0.3, -size * 1.1, size * 0.08, size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(size * 0.3, -size * 1.1, size * 0.08, size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                }
                case 'cat': {
                    ctx.fillStyle = '#b080e0';
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.6, -size * 0.4);
                    ctx.lineTo(-size * 0.75, -size * 1.2);
                    ctx.lineTo(-size * 0.2, -size * 0.55);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(size * 0.6, -size * 0.4);
                    ctx.lineTo(size * 0.75, -size * 1.2);
                    ctx.lineTo(size * 0.2, -size * 0.55);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'sunglasses': {
                    ctx.fillStyle = '#1a2a4a';
                    ctx.beginPath(); ctx.arc(lx, ly, size * 0.35, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(rx, ry, size * 0.35, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#1a2a4a';
                    ctx.lineWidth = size * 0.1;
                    ctx.beginPath();
                    ctx.moveTo(lx, ly); ctx.lineTo(rx, ry);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(120,180,255,0.35)';
                    ctx.beginPath(); ctx.arc(lx - size * 0.1, ly - size * 0.1, size * 0.12, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(rx - size * 0.1, ry - size * 0.1, size * 0.12, 0, Math.PI * 2); ctx.fill();
                    break;
                }
                case '3dglasses': {
                    ctx.fillStyle = '#dd2222';
                    ctx.beginPath(); ctx.arc(lx, ly, size * 0.35, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#2244dd';
                    ctx.beginPath(); ctx.arc(rx, ry, size * 0.35, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#111';
                    ctx.lineWidth = size * 0.08;
                    ctx.beginPath();
                    ctx.moveTo(lx, ly); ctx.lineTo(rx, ry);
                    ctx.stroke();
                    break;
                }
                case 'heartglasses': {
                    const heart = (hx, hy, s) => {
                        ctx.beginPath();
                        ctx.moveTo(hx, hy + s * 0.6);
                        ctx.bezierCurveTo(hx - s * 1.3, hy - s * 0.5, hx - s * 0.4, hy - s * 1.2, hx, hy - s * 0.35);
                        ctx.bezierCurveTo(hx + s * 0.4, hy - s * 1.2, hx + s * 1.3, hy - s * 0.5, hx, hy + s * 0.6);
                        ctx.closePath();
                        ctx.fill();
                    };
                    ctx.fillStyle = '#ff66aa';
                    heart(lx, ly, size * 0.35);
                    heart(rx, ry, size * 0.35);
                    ctx.strokeStyle = '#ff66aa';
                    ctx.lineWidth = size * 0.08;
                    ctx.beginPath();
                    ctx.moveTo(lx, ly); ctx.lineTo(rx, ry);
                    ctx.stroke();
                    break;
                }
                case 'blonde': {
                    ctx.fillStyle = '#e8c850';
                    ctx.beginPath();
                    ctx.arc(0, -size * 0.15, size * 1.0, Math.PI * 1.05, Math.PI * 1.95);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#d4b040';
                    ctx.beginPath();
                    ctx.ellipse(0, -size * 0.15, size * 1.0, size * 0.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                }
                case 'afro': {
                    ctx.fillStyle = '#cc5522';
                    for (let i = 0; i < 10; i++) {
                        const a = (i / 10) * Math.PI * 2;
                        const r = size * 1.1;
                        ctx.beginPath();
                        ctx.arc(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7 - size * 0.15, size * 0.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;
                }
                case 'headphones': {
                    ctx.strokeStyle = '#cc6622';
                    ctx.lineWidth = size * 0.18;
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 0.9, Math.PI * 1.1, Math.PI * 1.9);
                    ctx.stroke();
                    ctx.fillStyle = '#cc6622';
                    ctx.beginPath(); ctx.arc(-size * 0.9, 0, size * 0.32, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(size * 0.9, 0, size * 0.32, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#8a4418';
                    ctx.beginPath(); ctx.arc(-size * 0.9, 0, size * 0.18, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(size * 0.9, 0, size * 0.18, 0, Math.PI * 2); ctx.fill();
                    break;
                }
                case 'goggles': {
                    ctx.fillStyle = '#22bb22';
                    ctx.beginPath();
                    ctx.ellipse((lx+rx)/2, (ly+ry)/2, size * 0.95, size * 0.38, -eyeAngle, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(180,255,180,0.5)';
                    ctx.beginPath();
                    ctx.ellipse((lx+rx)/2 - size * 0.25, (ly+ry)/2 - size * 0.1, size * 0.35, size * 0.15, -eyeAngle, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                }
                case 'horns': {
                    ctx.fillStyle = '#aa2222';
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.65, -size * 0.35);
                    ctx.quadraticCurveTo(-size * 1.1, -size * 0.9, -size * 0.85, -size * 1.4);
                    ctx.quadraticCurveTo(-size * 0.6, -size * 0.9, -size * 0.35, -size * 0.55);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(size * 0.65, -size * 0.35);
                    ctx.quadraticCurveTo(size * 1.1, -size * 0.9, size * 0.85, -size * 1.4);
                    ctx.quadraticCurveTo(size * 0.6, -size * 0.9, size * 0.35, -size * 0.55);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'angelwings': {
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 2;
                    for (const side of [-1, 1]) {
                        ctx.beginPath();
                        ctx.moveTo(side * size * 0.4, -size * 0.15);
                        ctx.quadraticCurveTo(side * size * 1.6, -size * 1.1, side * size * 1.5, size * 0.15);
                        ctx.quadraticCurveTo(side * size * 1.2, -size * 0.35, side * size * 0.4, size * 0.15);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                    break;
                }
                case 'bowtie': {
                    ctx.fillStyle = '#ff44aa';
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.15, -size * 0.9);
                    ctx.lineTo(-size * 0.7, -size * 1.25);
                    ctx.lineTo(-size * 0.7, -size * 0.55);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(size * 0.15, -size * 0.9);
                    ctx.lineTo(size * 0.7, -size * 1.25);
                    ctx.lineTo(size * 0.7, -size * 0.55);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#cc2288';
                    ctx.beginPath();
                    ctx.arc(0, -size * 0.9, size * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                }
                case 'mustache': {
                    ctx.fillStyle = '#4a2a1a';
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.5, size * 0.3);
                    ctx.quadraticCurveTo(-size * 0.65, -size * 0.1, -size * 0.1, 0);
                    ctx.quadraticCurveTo(0, size * 0.15, size * 0.1, 0);
                    ctx.quadraticCurveTo(size * 0.65, -size * 0.1, size * 0.5, size * 0.3);
                    ctx.quadraticCurveTo(size * 0.2, size * 0.4, 0, size * 0.15);
                    ctx.quadraticCurveTo(-size * 0.2, size * 0.4, -size * 0.5, size * 0.3);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }

        function getGlowSprite(color) {
            const m = color.match(/hsl\((\d+)/);
            const hue = m ? Math.floor(parseInt(m[1]) / 10) * 10 : 0;

            let sprite = glowCache.get(hue);
            if (sprite) return sprite;

            const S = 64;
            const c = document.createElement('canvas');
            c.width = S;
            c.height = S;
            const cx = c.getContext('2d');
            const grad = cx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
            grad.addColorStop(0, `hsl(${hue}, 100%, 50%)`);
            grad.addColorStop(0.4, `hsl(${hue}, 100%, 50%)`);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            cx.fillStyle = grad;
            cx.fillRect(0, 0, S, S);

            glowCache.set(hue, c);
            return c;
        }

        // Cache glow sprites per hue (10° buckets) so we only build each once
                let glowSprite = null;
        let lastGlowHue = -1;
        let lastGlowBodySize = -1;

        function getBoostGlowSprite(hue, bodySize) {
            const bucketHue = Math.floor(hue / 10) * 10;
            if (glowSprite && lastGlowHue === bucketHue && lastGlowBodySize === bodySize) {
                return glowSprite;
            }

            const S = 256;
            const c = document.createElement('canvas');
            c.width = S; c.height = S;
            const cx = c.getContext('2d');

            const R = S / 2;
            const glowRadius = bodySize + 60;         // wider halo
            const bodyRatio = bodySize / glowRadius;
            const f = 1 - bodyRatio;

            const grad = cx.createRadialGradient(R, R, 0, R, R, R);

            // ----- NO INNER GLOW — fully transparent until the skin edge -----
            grad.addColorStop(0,                        'rgba(0,0,0,0)');
            grad.addColorStop(bodyRatio * 0.98,         'rgba(0,0,0,0)');

            // ----- NARROW SUPER-BRIGHT PEAK (≈2px wide on screen) -----
            grad.addColorStop(bodyRatio * 0.995,        `hsla(${bucketHue}, 100%, 78%, 1.00)`);
            grad.addColorStop(bodyRatio,                `hsla(${bucketHue}, 100%, 78%, 1.00)`);
            grad.addColorStop(bodyRatio * 1.025,        `hsla(${bucketHue}, 100%, 78%, 1.00)`);

            // ----- VERY FAST FIRST FALLOFF (dim 65% in first ~5px) -----
            grad.addColorStop(bodyRatio + f * 0.06,     `hsla(${bucketHue}, 100%, 62%, 0.35)`);
            grad.addColorStop(bodyRatio + f * 0.14,     `hsla(${bucketHue}, 100%, 55%, 0.14)`);

            // ----- LONG DIM TAIL (lots of low-alpha pixels = "shadow") -----
            grad.addColorStop(bodyRatio + f * 0.28,     `hsla(${bucketHue}, 98%,  50%, 0.05)`);
            grad.addColorStop(bodyRatio + f * 0.48,     `hsla(${bucketHue}, 95%,  46%, 0.02)`);
            grad.addColorStop(bodyRatio + f * 0.72,     `hsla(${bucketHue}, 92%,  44%, 0.008)`);
            grad.addColorStop(bodyRatio + f * 0.90,     `hsla(${bucketHue}, 88%,  42%, 0.002)`);
            grad.addColorStop(1.00,                     'rgba(0,0,0,0)');

            cx.fillStyle = grad;
            cx.fillRect(0, 0, S, S);

            glowSprite = c;
            lastGlowHue = bucketHue;
            lastGlowBodySize = bodySize;
            return c;
        }

                function createAISnake() {
            const NAMES = [
                'sk8 or die (bot)',

                'chicken (bot)',
                'need for speed (bot)',
                'real human! (bot)',
                'snake (bot)'
            ];

            const snake = {
                id: 'ai-' + Math.random().toString(36).substr(2, 9),
                segments: [],
                color: `hsl(${hue}, 100%, 50%)`,
                speed: 2.0 + Math.random() * 2,
                boostSpeed: 4.0 + Math.random() * 2,
                direction: Math.random() * Math.PI * 2,
                targetDirection: Math.random() * Math.PI * 2,
                size: 12 + Math.random() * 8,
                targetSize: 12 + Math.random() * 8,
                length: 15 + Math.floor(Math.random() * 30),
                mass: 0,
                x: x,
                y: y,
                isAlive: true,
                directionChangeTimer: 0,
                targetChangeTimer: 0,
                name: NAMES[Math.floor(Math.random() * NAMES.length)],
                behavior: Math.floor(Math.random() * 3),
                growthTimer: Math.floor(Math.random() * AI_GROWTH_INTERVAL),
                boostAccumulator: 0,
                isBoosting: false
            };

            for (let i = 0; i < snake.length; i++) {

        function calculateSnakeMass(snake) {
            let m = 0;
            for (let i = 0; i < snake.segments.length; i++) {
                m += Math.PI * Math.pow(snake.segments[i].size, 2);
            }
            return m;
        }

        function updateSegments(snake, spacing) {
            if (snake.segments.length === 0) {
                snake.segments.push({ x: snake.x, y: snake.y, size: snake.targetSize });
            }
            if (!isFinite(snake.length) || snake.length < 1) snake.length = 1;
            snake.segments[0].x = snake.x;
            snake.segments[0].y = snake.y;

            while (snake.segments.length < snake.length) {
                const tail = snake.segments[snake.segments.length - 1];
                snake.segments.push({ x: tail.x, y: tail.y, size: tail.size });
            }
            while (snake.segments.length > snake.length) {
                snake.segments.pop();
            }

            for (let i = 1; i < snake.segments.length; i++) {
                const prev = snake.segments[i - 1];
                const seg = snake.segments[i];
                const dx = prev.x - seg.x;
                const dy = prev.y - seg.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > spacing) {
                    const t = (dist - spacing) / dist;
                    seg.x += dx * t;
                    seg.y += dy * t;
                }
            }

            for (let i = 0; i < snake.segments.length; i++) {
                const seg = snake.segments[i];
                seg.size += (snake.targetSize - seg.size) * 0.1;
            }
        }

                        function getSpinePoints(snake) {
            const pts = [];
            if (!snake.segments.length) return pts;

            pts.push({
                x: snake.x,
                y: snake.y,
                radius: SPINE_HITBOX_RADIUS
            });

            const SPINE_STEP = 6;
            for (let i = 1; i < snake.segments.length; i++) {
                const a = snake.segments[i - 1];
                const b = snake.segments[i];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 0.01) continue;
                const steps = Math.max(1, Math.floor(dist / SPINE_STEP));
                for (let s = 1; s <= steps; s++) {
                    const t = s / steps;
                    pts.push({
                        x: a.x + dx * t,
                        y: a.y + dy * t,
                        radius: SPINE_HITBOX_RADIUS
                    });
                }
            }
            return pts;
        }

                // ========== SPATIAL HASH FOR AI-AI PROXIMITY ==========
        const AI_HASH_CELL = 500;

        function buildAIHash() {
            const hash = new Map();
            for (let i = 0; i < aiSnakes.length; i++) {
                const s = aiSnakes[i];
                if (!s.isAlive) continue;
                const segs = s.segments;
                const step = Math.max(1, Math.floor(segs.length / 15));
                let lastKey = '';
                for (let j = 0; j < segs.length; j += step) {
                    const seg = segs[j];
                    const cx = Math.floor(seg.x / AI_HASH_CELL);
                    const cy = Math.floor(seg.y / AI_HASH_CELL);
                    const key = cx + ',' + cy;
                    if (key === lastKey) continue;
                    lastKey = key;
                    let cell = hash.get(key);
                    if (!cell) { cell = []; hash.set(key, cell); }
                    if (cell[cell.length - 1] !== s) cell.push(s);
                }
            }
            return hash;
        }

        function getNearbyAIs(x, y, hash) {
            const cx = Math.floor(x / AI_HASH_CELL);
            const cy = Math.floor(y / AI_HASH_CELL);
            const result = [];
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const cell = hash.get((cx + dx) + ',' + (cy + dy));
                    if (cell) {
                        for (let i = 0; i < cell.length; i++) result.push(cell[i]);
                    }
                }
            }
            return result;
        }

        // ========== DEATH MECHANICS ==========
        function checkCollisions() {
            if (!playerSnake.isAlive) return;

            const playerHeadX = playerSnake.x;
            const playerHeadY = playerSnake.y;
            const playerHeadRadius = playerSnake.segments[0].size * HEAD_HITBOX_SCALE;

            // Compute the player's full bounding box once per frame so that
            // AI near the TAIL are still checked, not just AI near the head.
            let pbMinX = Infinity, pbMaxX = -Infinity;
            let pbMinY = Infinity, pbMaxY = -Infinity;
            for (let i = 0; i < playerSnake.segments.length; i++) {
                const s = playerSnake.segments[i];
                if (s.x < pbMinX) pbMinX = s.x;
                if (s.x > pbMaxX) pbMaxX = s.x;
                if (s.y < pbMinY) pbMinY = s.y;
                if (s.y > pbMaxY) pbMaxY = s.y;
            }
            const CULL_MARGIN = 300;
            pbMinX -= CULL_MARGIN; pbMaxX += CULL_MARGIN;
            pbMinY -= CULL_MARGIN; pbMaxY += CULL_MARGIN;

            aiSnakes.forEach(aiSnake => {
                if (!aiSnake.isAlive) return;

                // Cull against the player's whole body, not just its head
                if (aiSnake.x < pbMinX || aiSnake.x > pbMaxX) return;
                if (aiSnake.y < pbMinY || aiSnake.y > pbMaxY) return;

                const aiSpine = getSpinePoints(aiSnake);

                const startIdx = isBoosting ? 0 : 1;
                for (let i = startIdx; i < aiSpine.length; i++) {
                    const pt = aiSpine[i];
                    const dx = playerHeadX - pt.x;
                    const dy = playerHeadY - pt.y;
                    const minDist = playerHeadRadius + pt.radius;
                    if (dx * dx + dy * dy < minDist * minDist) {
                        killSnake(playerSnake);
                        return;
                    }
                }

                                if (isBoosting) {
                    const dx = playerHeadX - aiSnake.x;
                    const dy = playerHeadY - aiSnake.y;
                    const minDist = playerHeadRadius + aiSnake.segments[0].size * HEAD_HITBOX_SCALE;
                    if (dx * dx + dy * dy < minDist * minDist) {
                        if (playerSnake.mass > aiSnake.mass) killSnake(aiSnake);
                        else killSnake(playerSnake);
                        return;
                    }
                }

                const aiHeadX = aiSnake.x;
                const aiHeadY = aiSnake.y;
                const aiHeadRadius = aiSnake.segments[0].size * HEAD_HITBOX_SCALE;
                const playerSpine = getSpinePoints(playerSnake);
                for (let i = 1; i < playerSpine.length; i++) {
                    const pt = playerSpine[i];
                    const dx = aiHeadX - pt.x;
                    const dy = aiHeadY - pt.y;
                    const minDist = aiHeadRadius + pt.radius;
                    if (dx * dx + dy * dy < minDist * minDist) {
                        killSnake(aiSnake);
                        break;
                    }
                }
            });

                        // ---- Remote player collisions (same rules as AI) ----
            for (const remote of remoteSnakes.values()) {
                if (!remote.isAlive) continue;
                if (!remote.segments || remote.segments.length < 2) continue;

                // Cull against our bounding box
                if (remote.x < pbMinX || remote.x > pbMaxX) continue;
                if (remote.y < pbMinY || remote.y > pbMaxY) continue;

                const remoteSpine = getSpinePoints(remote);

                // Our head vs their body
                const startIdx = isBoosting ? 0 : 1;
                for (let i = startIdx; i < remoteSpine.length; i++) {
                    const pt = remoteSpine[i];
                    const dx = playerHeadX - pt.x;
                    const dy = playerHeadY - pt.y;
                    const minDist = playerHeadRadius + pt.radius;
                    if (dx * dx + dy * dy < minDist * minDist) {
                        killSnake(playerSnake);
                        return;
                    }
                }

                // Head-to-head when both boosting — smaller mass loses
                if (isBoosting && remote.boostRamp > 0.5) {
                    const dx = playerHeadX - remote.x;
                    const dy = playerHeadY - remote.y;
                    const minDist = playerHeadRadius + remote.segments[0].size * HEAD_HITBOX_SCALE;
                    if (dx * dx + dy * dy < minDist * minDist) {
                        if (playerSnake.mass < remote.mass) {
                            killSnake(playerSnake);
                            return;
                        }
                        // If we're bigger, do nothing — they'll detect their own death
                    }
                }

                // Their head vs our body — they detect it on their end.
                // We don't kill them from here.
            }
        }

        function killSnake(snake) {
            if (!snake.isAlive) return;
            snake.isAlive = false;

            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: snake.x,
                    y: snake.y,
                    size: snake.size * (0.5 + Math.random() * 0.5),
                    color: snake.color,
                    life: 40 + Math.random() * 20,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8
                });
            }

            const totalGain = Math.floor(snake.length * 0.75);
            const fullPellets = Math.floor(totalGain / 10);
            const remainder = totalGain - fullPellets * 10;
            const totalPellets = fullPellets + (remainder > 0 ? 1 : 0);

            for (let p = 0; p < totalPellets; p++) {
                const t = totalPellets > 1 ? p / (totalPellets - 1) : 0;
                const segIdx = Math.min(
                    snake.segments.length - 1,
                    Math.floor(t * (snake.segments.length - 1))
                );
                const seg = snake.segments[segIdx];
                const isLast = (p === totalPellets - 1 && remainder > 0);

                foodParticles.push({
                    x: seg.x + (Math.random() - 0.5) * seg.size * 0.35,
                    y: seg.y + (Math.random() - 0.5) * seg.size * 0.35,
                    size: seg.size * 1.15,
                    color: snake.color,
                    mass: isLast ? remainder : 10,
                    lengthGain: isLast ? remainder : 10
                });
            }

            if (snake.id === 'player') {
                if (mpSocket && mpSocket.readyState === 1) {
                    try {
                        // Send exact body positions + color so remote screens
                        // can spawn matching food at the death location
                        const segs = [];
                        for (let i = 0; i < snake.segments.length; i += 2) {
                            const s = snake.segments[i];
                            segs.push({
                                x: Math.round(s.x),
                                y: Math.round(s.y),
                                size: Math.round(s.size)
                            });
                        }
                        mpSocket.send(JSON.stringify({
                            type: 'death',
                            segments: segs,
                            color: `hsl(${savedHue}, 100%, 50%)`
                        }));
                    } catch (e) {}
                }
                document.getElementById('final-score').textContent = score;
                setTimeout(() => {
                    startFadeToMenu();
                }, 800);
            }
        }

                function startFadeToMenu() {
            const overlay = document.getElementById('fade-overlay');
            if (!overlay) return;

            overlay.style.display = 'block';
            overlay.style.opacity = 0;

            // Fade to black
            let opacity = 0;
            const fadeIn = setInterval(() => {
                opacity += 0.035;
                overlay.style.opacity = Math.min(1, opacity);

                if (opacity >= 1) {
                    clearInterval(fadeIn);

                    // Switch screens while the overlay is fully black
                    gameStarted = false;
                    if (animationFrameId) {
                        cancelAnimationFrame(animationFrameId);
                        animationFrameId = null;
                    }
                    document.getElementById('death-screen').style.display = 'none';
                    document.getElementById('start-screen').style.display = 'flex';
                    document.getElementById('change-skin-btn').style.display = 'flex';
                    document.getElementById('change-cosmetic-btn').style.display = 'flex';

                    // Hold on black briefly, then fade back in
                    setTimeout(() => {
                        let outOpacity = 1;
                        const fadeOut = setInterval(() => {
                            outOpacity -= 0.035;
                            overlay.style.opacity = Math.max(0, outOpacity);

                            if (outOpacity <= 0) {
                                clearInterval(fadeOut);
                                overlay.style.display = 'none';
                            }
                        }, 16);
                    }, 250);
                }
            }, 16);
        }

        // ========== INPUT HANDLING ==========
        function setupInputHandlers() {
            canvas.addEventListener('mousemove', (e) => {
                if (!gameStarted || !playerSnake.isAlive) return;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const relX = e.clientX - centerX;
                const relY = e.clientY - centerY;
                mouseBuffer.push({
                    time: performance.now(),
                    direction: Math.atan2(relY, relX),
                    distance: Math.min(Math.sqrt(relX * relX + relY * relY), 500)
                });
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();

                    Math.sin(rawDesired - lastRawDesired),
                    Math.cos(rawDesired - lastRawDesired)

                    Math.sin(rawDesired - accumulatedDesired),

                    }

                                // Ramp current speed toward target over BOOST_RAMP_MS milliseconds
                                // Ramp current speed toward target over BOOST_RAMP_MS milliseconds

                                                const bodyRadius = playerSnake.targetSize;

                        older = snaps[i];
                        newer = snaps[i + 1];

                    }
                }
                if (!older) { older = snaps[0]; newer = snaps[0]; }
                if (!newer) { older = snaps[snaps.length - 1]; newer = snaps[snaps.length - 1]; }

                const span = (newer.time - older.time) || 1;
                const t = Math.max(0, Math.min(1, (playbackTime - older.time) / span));

                snake.y = (snake.y + WORLD_SIZE.height) % WORLD_SIZE.height;

                function initCosmeticSystem() {
            const changeBtn = document.getElementById('change-cosmetic-btn');

                sCanvas.width = window.innerWidth;
                sCanvas.height = window.innerHeight;
                W = sCanvas.width;
                H = sCanvas.height;
            });

            const COLS = 6;
            const ROWS = 3;
            // Smaller cells — grid takes less vertical space
            const cellW = Math.min(W * 0.75 / COLS, 110);
            const cellH = Math.min(H * 0.42 / ROWS, 110);
            const gridW = cellW * COLS;
            const gridH = cellH * ROWS;
            const gridX = (W - gridW) / 2;
            // Push grid up — leaves room for the SAVE button below
            const gridY = (H - gridH) / 2 - H * 0.08;

            const cosTile = makeHexTile(60, 48, 12, '#1a3a26', 'rgba(0,0,0,0.9)');
            const cosPattern = sctx.createPattern(cosTile, 'repeat');

            let bgOffset = 0;
            let animId = null;
            let hoverIndex = -1;

            function cellRect(i) {
                const col = i % COLS;
                const row = Math.floor(i / COLS);
                return {
                    x: gridX + col * cellW,
                    y: gridY + row * cellH,
                    w: cellW,
                    h: cellH
                };
            }

            function pointInRect(px, py, r) {
                return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
            }

            function drawFrame() {
                bgOffset -= 3;
                if (bgOffset < -cosTile.width) bgOffset += cosTile.width;

                sctx.save();
                sctx.fillStyle = '#0a1a10';
                sctx.fillRect(0, 0, W, H);
                sctx.translate(bgOffset, 0);
                sctx.fillStyle = cosPattern;
                sctx.fillRect(-bgOffset, 0, W + cosTile.width, H);
                sctx.restore();

                // Title — floats above the grid
                sctx.fillStyle = '#ffffff';
                sctx.font = 'bold 36px Arial';
                sctx.textAlign = 'center';
                sctx.textBaseline = 'middle';
                sctx.fillText('COSMETICS', W / 2, gridY - 50);

                // Draw cosmetics with no boxes, no borders — just floating icons
                for (let i = 0; i < COLS * ROWS; i++) {
                    const r = cellRect(i);
                    const id = COSMETICS[i];
                    if (!id) continue;

                    const isSelected = id === savedCosmetic;
                    const isHover = i === hoverIndex;

                    const cx = r.x + r.w / 2;
                    const cy = r.y + r.h / 2;
                    const previewSize = r.h * 0.28;

                    // Selected ring — subtle circle behind the icon
                    if (isSelected) {
                        sctx.beginPath();
                        sctx.arc(cx, cy, previewSize * 1.6, 0, Math.PI * 2);
                        sctx.strokeStyle = '#7ec86a';
                        sctx.lineWidth = 4;
                        sctx.stroke();
                        sctx.fillStyle = 'rgba(126, 200, 106, 0.15)';
                        sctx.fill();
                    } else if (isHover) {
                        sctx.beginPath();
                        sctx.arc(cx, cy, previewSize * 1.6, 0, Math.PI * 2);
                        sctx.strokeStyle = 'rgba(255,255,255,0.5)';
                        sctx.lineWidth = 2;
                        sctx.stroke();
                    }

                    if (id === 'none') {
                        sctx.strokeStyle = '#cc2222';
                        sctx.lineWidth = 6;
                        sctx.beginPath();
                        sctx.arc(cx, cy, previewSize * 1.1, 0, Math.PI * 2);
                        sctx.stroke();
                        sctx.beginPath();
                        sctx.moveTo(cx - previewSize * 0.8, cy + previewSize * 0.8);
                        sctx.lineTo(cx + previewSize * 0.8, cy - previewSize * 0.8);
                        sctx.stroke();
                    } else {
                        drawCosmetic(sctx, id, cx, cy, previewSize, -Math.PI / 2, true);

                sCanvas.style.cursor = hoverIndex >= 0 ? 'pointer' : 'default';

            sCanvas.addEventListener('click', (e) => {
                const rect = sCanvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                for (let i = 0; i < COLS * ROWS; i++) {
                    if (pointInRect(mx, my, cellRect(i))) {

            const cy = canvas.height - pad - size / 2;
            const r = size / 2;

            const worldToMapX = (wx) => cx - r + (wx / WORLD_SIZE.width) * size;
            const worldToMapY = (wy) => cy - r + (wy / WORLD_SIZE.height) * size;

            }

            // ---- Outer ring ----
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, r - 1, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

                // ========== MULTIPLAYER (Phase 1) ==========
        let mpSocket = null;
        let mpId = null;
        const remoteSnakes = new Map();
        let mpSendTimer = 0;
        let mpStatus = 'connecting';

        function initMultiplayer() {
            try {
                mpSocket = new WebSocket('ws://132.226.129.231:3001');

                mpSocket.addEventListener('open', () => {
                    mpStatus = 'connected';
                    console.log('[MP] connected');
                });

                mpSocket.addEventListener('close', () => {
                    mpStatus = 'disconnected';
                    console.log('[MP] closed');
                });

                mpSocket.addEventListener('error', () => {
                    mpStatus = 'error';
                    console.log('[MP] error');
                });

                mpSocket.addEventListener('message', (e) => {
                    let msg;
                    try { msg = JSON.parse(e.data); } catch (err) { return; }

                    if (msg.type === 'welcome') {
                        mpId = msg.id;
                                                                                } else if (msg.type === 'snakes') {
                        const now = performance.now();
                        const seen = new Set();

                        for (const s of msg.snakes) {
                            if (s.id === mpId) continue;
                            if (s.x == null) continue;
                            seen.add(s.id);

                            let remote = remoteSnakes.get(s.id);
                            if (!remote) {
                                remote = {
                                    id: s.id,
                                    name: s.name,
                                    color: `hsl(${s.hue}, 100%, 50%)`,
                                    size: s.targetSize,
                                    targetSize: s.targetSize,
                                    length: s.length,
                                    mass: s.mass || 0,
                                    boostRamp: 0,
                                    x: s.x,
                                    y: s.y,
                                    direction: s.dir,
                                    isAlive: true,
                                    snapshots: [],
                                    segments: []
                                };
                                remoteSnakes.set(s.id, remote);
                            }

                            remote.snapshots.push({
                                time: now,
                                x: s.x,
                                y: s.y,
                                dir: s.dir,
                                speed: s.speed,
                                targetSize: s.targetSize,
                                length: s.length,
                                mass: s.mass || 0,
                                boost: !!s.boost
                            });

                            // Smoothly ramp boost for the glow effect
                            const targetBoost = s.boost ? 1 : 0;
                            remote.boostRamp = remote.boostRamp + (targetBoost - remote.boostRamp) * 0.25;

                            while (remote.snapshots.length > 0 &&
                                   now - remote.snapshots[0].time > 1000) {
                                remote.snapshots.shift();
                            }
                        }

                        for (const id of [...remoteSnakes.keys()]) {
                            if (!seen.has(id)) remoteSnakes.delete(id);
                        }
                    } else if (msg.type === 'death' && msg.id !== mpId) {
                        const remote = remoteSnakes.get(msg.id);

                        // Use the segments sent with the death message — that's
                        // the exact world position, so food spawns where the
                        // survivor actually saw the snake, not a stale copy.
                        const deadSegments = msg.segments || (remote && remote.segments) || [];
                        const deadColor = msg.color || (remote && remote.color) || 'hsl(280,100%,50%)';

                        for (let i = 0; i < deadSegments.length; i++) {
                            const seg = deadSegments[i];

                            // Skip segments off-screen — no point spawning
                            // food the survivor can't see anyway (they'll
                            // respawn / reconnect)
                            const dx = seg.x - camera.x;
                            const dy = seg.y - camera.y;
                            const vw = canvas.width / zoom;
                            const vh = canvas.height / zoom;
                            if (dx < -200 || dx > vw + 200) continue;
                            if (dy < -200 || dy > vh + 200) continue;

                            // Death pellet
                            foodParticles.push({
                                x: seg.x + (Math.random() - 0.5) * seg.size * 0.35,
                                y: seg.y + (Math.random() - 0.5) * seg.size * 0.35,
                                size: seg.size * 1.15,
                                color: deadColor,
                                mass: 10,
                                lengthGain: 10,
                                wigSeed: Math.random() * Math.PI * 2,
                                wigSpeed: 0.6 + Math.random() * 0.6
                            });

                            // A few sparks for visual feedback
                            for (let k = 0; k < 2; k++) {
                                particles.push({
                                    x: seg.x, y: seg.y,
                                    size: seg.size * 0.5,
                                    color: deadColor,
                                    life: 30 + Math.random() * 20,
                                    vx: (Math.random() - 0.5) * 6,
                                    vy: (Math.random() - 0.5) * 6
                                });
                            }
                        }

                        // Remove the frozen snake from the survivors' view
                        remoteSnakes.delete(msg.id);
                    }
                });
            } catch (e) {
                console.warn('[MP] failed to init:', e);
            }
        }

        initMultiplayer();

        setupInputHandlers();
    </script>
